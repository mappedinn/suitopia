<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suitopia</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:#eaf4ff;color:#14213d;line-height:1.45}
header{background:#27408b;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.25rem;margin:0;flex:1}
main{max-width:960px;margin:0 auto;padding:12px}
button{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:9px 15px;background:#27408b;color:#fff;cursor:pointer;min-height:42px}
button.alt{background:#fff;color:#27408b;box-shadow:inset 0 0 0 2px #27408b}
button.on{background:#ffb703;color:#14213d;box-shadow:none}
button:disabled{opacity:.4;cursor:default}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 10px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lvl{text-align:left;padding:18px;font-size:1.05rem}.lvl small{display:block;font-weight:normal;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input{font:inherit;font-size:1.15rem;padding:8px;border:2px solid #8aa;border-radius:10px;max-width:100%}
input.num{width:80px;text-align:center}
input.rule{flex:1;min-width:200px}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;display:none}
.msg.ok{display:block;background:#d8f3dc}.msg.no{display:block;background:#ffe3e0}.msg.tip{display:block;background:#fff3c4}
.machine{max-width:460px;margin:auto}
.pair{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:8px;margin:6px 0}
.box{border:3px solid #14213d;border-radius:8px;height:56px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;background:#fff}
.box input{width:100%;height:100%;border:0;text-align:center;font-weight:bold;background:#fff3c4}
.lane{position:relative;height:62px}
.lane:before{content:"";position:absolute;left:0;right:0;top:30px;border-top:3px dashed #8aa}
.lane svg{position:absolute;left:50%;top:0;margin-left:-24px;width:48px;height:62px}
.ball{position:absolute;top:18px;left:0;width:28px;height:28px;border-radius:50%;background:#ffb703;font-size:.8rem;font-weight:bold;display:flex;align-items:center;justify-content:center;opacity:0;z-index:2}
.ball.out{left:calc(100% - 34px);background:#80ed99}
.ball{width:34px!important;height:34px!important;top:14px!important;font-size:1rem!important;border:2px solid #14213d}
.run .in{animation:enter 1.2s ease-in var(--d) both}
.run .out{animation:leave 1.2s ease-out calc(var(--d) + 1.7s) both}
.run svg{animation:shake .25s 4 calc(var(--d) + 1s)}
.run+.box>span{animation:appear .3s calc(var(--d) + 2.9s) both}
@keyframes enter{0%{left:0;opacity:0;transform:scale(1)}15%{left:0;opacity:1}80%{opacity:1}100%{left:calc(50% - 17px);opacity:0;transform:scale(.3)}}
@keyframes leave{0%{left:calc(50% - 17px);opacity:0;transform:scale(.3)}20%{opacity:1}100%{left:calc(100% - 34px);opacity:1;transform:scale(1)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes shake{50%{transform:rotate(9deg)}}
.happy{animation:jump .5s 3}
@keyframes jump{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.happy{animation:none!important}}
.figs{display:flex;gap:18px;overflow-x:auto;align-items:flex-end;padding:8px 2px}
.fig{text-align:center;flex:0 0 auto;margin:auto}
.fig b{display:block;border:2px solid #14213d;border-radius:6px;padding:2px 22px;margin-top:6px}
table{border-collapse:collapse;margin:8px 0;max-width:100%}
td,th{border:2px solid #27408b;padding:5px 8px;text-align:center;min-width:48px}
td input{width:62px;text-align:center}
.build{display:grid;grid-template-columns:repeat(8,34px);gap:2px;overflow-x:auto;padding:4px 0}
.cell{width:34px;height:34px;min-height:0;padding:0;border-radius:3px;border:1px dashed #789;background:#f7fbff}
.boardwrap{overflow-x:auto;border:2px solid #27408b;border-radius:12px;background:#fff}
#board{display:block;touch-action:none}
.tool{background:#fff;box-shadow:inset 0 0 0 2px #aac;padding:4px;touch-action:none}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #556;padding:0}
.sw.on{box-shadow:0 0 0 4px #14213d}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal>div{background:#fff;border-radius:14px;padding:14px;max-width:900px;max-height:100%;overflow:auto}
#modal img{max-width:100%;border:1px solid #ccc}

body{isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--sky,#eaf4ff) var(--img,none) center bottom/100% auto no-repeat}
main{padding-bottom:max(130px,22vw)!important}
.rulecard{display:flex;gap:12px;align-items:center;justify-content:center;background:#fff3c4;border:3px solid #ffb703;border-radius:14px;padding:12px;margin:8px 0;font-size:1.2rem}.rulecard svg{width:48px;height:62px;flex:0 0 auto}
.tm{width:68px;text-align:center}
.missions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0}.missions button{padding:6px 2px}.missions.six{grid-template-columns:repeat(6,minmax(0,1fr))}@media(max-width:520px){.missions.six{grid-template-columns:repeat(3,minmax(0,1fr))}}.propre{margin-top:16px;border:3px dashed #ffb703;border-radius:14px;padding:12px;background:#fffaf0}.et{display:block;font-size:.75rem;line-height:1}
/* Robots animés (en boucle, comme un GIF) */
#bots{position:fixed;left:0;bottom:0;width:100%;aspect-ratio:1376/768;z-index:-1;pointer-events:none}
.bot{position:absolute;display:none;transform-origin:50% 100%;animation:botbob 2.2s ease-in-out infinite}
.bot img{display:block;width:100%;height:100%}
.bot.m1{animation-duration:1.8s;animation-delay:-.7s}
body[data-bg="1"] .bot.bg1,body[data-bg="2"] .bot.bg2,body[data-bg="3"] .bot.bg3,body[data-bg="4"] .bot.bg4,body[data-bg="5"] .bot.bg5{display:block}
.bot i{position:absolute;border-radius:50%;opacity:0}
.bot .lid{background:#fdc015;animation:botlid 3.4s infinite}
.bot .lid:after{content:"";position:absolute;left:12%;right:12%;top:46%;height:12%;background:#1f3f73;border-radius:2px}
.bot .lamp{background:radial-gradient(circle,#fff 0 12%,#ff5a5f 38%,#ff5a5f55 58%,transparent 72%);animation:botlamp 1.1s ease-in-out infinite}
@keyframes botbob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4%) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-4%) rotate(3deg)}}
@keyframes botlid{0%,91%,97%,100%{opacity:0}92%,96%{opacity:1}}
@keyframes botlamp{0%,100%{opacity:0}50%{opacity:1}}
.rb-all{animation:rbbob 1.3s ease-in-out infinite}
.rb-arm{transform-box:view-box;transform-origin:41px 36px;animation:rbwave .8s ease-in-out infinite alternate}
.rb-eyes{transform-box:fill-box;transform-origin:center;animation:rbblink 3s infinite}
.rb-lamp{animation:rblamp 1s steps(1) infinite}
@keyframes rbbob{50%{transform:translateY(-3px)}}
@keyframes rbwave{from{transform:rotate(0)}to{transform:rotate(-35deg)}}
@keyframes rbblink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rblamp{50%{fill:#ffd60a}}
@media (prefers-reduced-motion:reduce){.bot,.bot i,.rb-all,.rb-arm,.rb-eyes,.rb-lamp{animation:none!important}}
/* Le robot du décor pose les tuiles au sol */
#sol{position:absolute;inset:0}
#sol .pose{position:absolute;z-index:3;visibility:hidden}
#sol .porteur{position:absolute;z-index:2;width:8.28%;height:20.21%;transition-property:left,top;transition-timing-function:ease-in-out}
#sol .porteur img{display:block;width:100%;height:100%;animation:marche .45s ease-in-out infinite;transform-origin:50% 100%}
@keyframes marche{25%{transform:translateY(-3%) rotate(-3deg)}75%{transform:translateY(-3%) rotate(3deg)}}
#sol.efface .pose{opacity:0;transition:opacity .8s}
/* Robot qui pose les tuiles */
.figs{position:relative}
.figs.chantier{padding-top:84px}
.poseur{position:absolute;left:0;top:2px;width:44px;height:57px;transition:transform .2s ease-in-out;pointer-events:none}
.poseur svg{display:block;width:44px;height:57px}
.poseur i{position:absolute;left:12px;top:57px;width:20px;height:20px;border:2px solid #14213d;opacity:0}
</style>

const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let saved={};try{saved=JSON.parse(localStorage.getItem('suites')||'{}')}catch(e){}

function pool(l,m){const r=[],add=(a,b)=>r.push([a,b]);
 const T=TYPE[m],add1=(x,y)=>{for(let v=x;v<=y;v++)add(1,v)},fois1=(x,y)=>{for(let v=x;v<=y;v++)add(v,0)},grid=(A,B)=>{for(let x=A[0];x<=A[1];x++)for(let y=B[0];y<=B[1];y++)add(x,y)};
 if(T!=='find'){const dur=m===5||m===8;if(l===1){add1(dur?10:2,dur?30:12);fois1(dur?5:2,dur?12:10)}else if(l===2)grid(dur?[3,9]:[2,6],dur?[3,15]:[1,9]);else grid(dur?[3,9]:[2,5],dur?[2,12]:[1,5])}
 else if(m>3){const k={4:0,7:1,9:2}[m];if(l===1){if(k===0)add1(10,25);else if(k===1)fois1(2,12);else{add1(15,40);fois1(6,12)}}
  else if(l===2)grid([[2,6],[3,9],[2,12]][k],[[1,10],[2,15],[1,20]][k]);else if(l===3)grid([[2,5],[3,6],[2,6]][k],[[2,5],[0,4],[1,5]][k]);else grid([[2,5],[3,6],[2,6]][k],[[1,4],[1,5],[1,5]][k])}
 else if(l===1){if(m===0)for(let b=4;b<=10;b++)add(1,b);else if(m===1)for(let b=2;b<=15;b++)add(1,b);else[4,5,6,7,8,9,11].forEach(a=>add(a,0))}
 else{const A=l===2?[[2,5],[2,6],[3,10]][m]:[[2,4],[2,4],[2,5]][m],B=l===2?[[1,5],[1,8],[2,12]][m]:l===3?[[0,3],[1,4],[1,5]][m]:[[1,3],[1,4],[1,5]][m];
  for(let a=A[0];a<=A[1];a++)for(let b=B[0];b<=B[1];b++)add(a,b)}
 const used=(LEVELS[l].ex[m]||[]).map(String);return r.filter(x=>!used.includes(String(x)))}

/* Lecture sécuritaire d’une règle écrite par l’élève (aucun eval) */
function parseRule(txt){
 let s=String(txt).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^.*=/,'')
 .replace(/numero de (la )?figure|numero|entree|figure/g,'n').replace(/\s/g,'').replace(/[x×·]/g,'*').replace(/−/g,'-');
 const t=s.match(/\d+|[n+\-*()]/g);if(!t||t.join('')!==s)return null;
 let i=0,bad=false;
 function sum(){let f=prod();while(t[i]==='+'||t[i]==='-'){const o=t[i++],a=f,c=prod();f=o==='+'?n=>a(n)+c(n):n=>a(n)-c(n)}return f}
 function prod(){let f=atom();while(t[i]==='*'||t[i]==='n'||t[i]==='('){if(t[i]==='*')i++;const a=f,c=atom();f=n=>a(n)*c(n)}return f}
 function atom(){const k=t[i++];if(k==='n')return n=>n;if(/^\d+$/.test(k||''))return()=>+k;if(k==='('){const f=sum();if(t[i++]!==')')bad=true;return f}bad=true;return()=>0}
 const f=sum();return bad||i<t.length?null:f}
const sameRule=(f,[a,b])=>[0,1,2,3,5,7,10,13].every(n=>f(n)===a*n+b);

/* Figures en tuiles */
function tilesFor(l,m,[a,b],n){const T=[];
 if(l===3){for(let r=0;r<n;r++)for(let c=0;c<a;c++)T.push({x:c-a/2,y:-r-1-(b?1:0),k:'g'});for(let c=0;c<b;c++)T.push({x:c-b/2,y:-1,k:'c'})}
 else{for(let r=0;r<n;r++)for(let c=0;c<a;c++)T.push({x:c-a/2,y:r-n/2,k:'g'});
  if(m<2){const h=n/2,w=a/2,pos=[[-.5,-h-1.35],[-.5,h+.35],[-w-1.35,-.5],[w+.35,-.5],[-.5,-h-2.75]];for(let i=0;i<b;i++)T.push({x:pos[i][0],y:pos[i][1],k:'c',d:true})}
  else for(let c=0;c<b;c++)T.push({x:c-b/2,y:-n/2-1,k:'c'})}
 return T}
function figSVG(l,m,rule,n,show){const S=24,T=tilesFor(l,m,rule,n);
 const xs=T.map(t=>t.x),ys=T.map(t=>t.y),x0=Math.min(...xs)-.3,y0=Math.min(...ys)-.3,w=Math.max(...xs)+1.3-x0,h=Math.max(...ys)+1.3-y0;
 return `<svg width="${w*S}" height="${h*S}" viewBox="${x0*S} ${y0*S} ${w*S} ${h*S}" overflow="visible">`+T.map(t=>{let col=l===3?(t.k==='g'?'#e63946':'#4895ef'):'#ffd60a';
 if(show&&l===4)col=t.k==='g'?'#e63946':'#4895ef';const s=t.d?S*.85:S,o=(S-s)/2;
 return `<g class="tuile"><rect x="${t.x*S+o}" y="${t.y*S+o}" width="${s}" height="${s}" fill="${col}" stroke="#14213d" stroke-width="2"${t.d?` transform="rotate(45 ${(t.x+.5)*S} ${(t.y+.5)*S})"`:''}/></g>`}).join('')+'</svg>'}
const figures=(l,m,r,show)=>`<div class="figs" data-cle="${l}-${m}-${r}">`+[1,2,3].map(n=>`<div class="fig">${figSVG(l,m,r,n,show)}<b>${n}</b></div>`).join('')+'</div>';

let tourSol=0;
async function decorSol(){
 const moi=++tourSol,sol=$('#sol'),liste=SOL[document.body.dataset.bg];sol.innerHTML='';sol.className='';
 if(!liste)return;
 const attendre=ms=>new Promise(r=>setTimeout(r,ms));
 const tuiles=liste.map(t=>{const i=new Image();i.alt='';i.className='pose';i.src=t.s;Object.assign(i.style,{left:t.x+'%',top:t.y+'%',width:t.w+'%',height:t.h+'%'});sol.appendChild(i);return i});
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){tuiles.forEach(i=>i.style.visibility='visible');return}
 const bot=document.createElement('div');bot.className='porteur';bot.innerHTML=`<img alt="" src="${ROBOT_SOL}">`;sol.appendChild(bot);
 const LW=8.276,LH=20.211,LEVE=5.5; /* hauteur de chute, en % */
 const aller=(x,y,d)=>{bot.style.transitionDuration=d+'ms';bot.style.left=x+'%';bot.style.top=y+'%'};
 const place=t=>[t.x+t.w/2-LW*.11,t.y+t.h/2-LEVE-LH*.67];
 while(moi===tourSol){
  sol.className='';tuiles.forEach(i=>i.style.visibility='hidden');
  aller(-LW,place(liste[0])[1],0);await attendre(60);
  for(let k=0;k<liste.length;k++){
   if(moi!==tourSol)return;
   const [x,y]=place(liste[k]),i=tuiles[k];aller(x,y,420);await attendre(440);
   if(moi!==tourSol)return;
   const haut=-LEVE/liste[k].h*100;i.style.visibility='visible';
   i.animate([{transform:`translateY(${haut}%)`},{transform:`translateY(${haut}%)`,offset:.2},{transform:'translateY(0)'}],{duration:380,easing:'ease-in'});
   await attendre(400)}
  aller(101,parseFloat(bot.style.top),1600);await attendre(3600);
  if(moi!==tourSol)return;
  sol.className='efface';await attendre(900)}
}
new MutationObserver(decorSol).observe(document.body,{attributes:true,attributeFilter:['data-bg']});

/* Le robot pose les tuiles une par une */
const dejaPose=new Set();
function poser(figs){
 const tuiles=[...figs.querySelectorAll('.tuile')];
 const bot=el(ROBOT,figs);bot.className='poseur';
 const pince=document.createElement('i');bot.appendChild(pince);
 const barre=document.createElement('div');barre.className='row';figs.after(barre);
 const b=document.createElement('button');b.className='alt';barre.appendChild(b);
 let tour=0,enCours=false;
 const attendre=ms=>new Promise(r=>setTimeout(r,ms));
 function fin(){tour++;enCours=false;tuiles.forEach(t=>{t.getAnimations().forEach(a=>a.cancel());t.style.visibility=''});bot.style.display='none';figs.classList.remove('chantier');b.textContent='▶ Revoir le robot poser les tuiles'}
 async function jouer(){fin();const moi=++tour;enCours=true;figs.classList.add('chantier');bot.style.display='block';b.textContent='⏩ Tout montrer';
  tuiles.forEach(t=>t.style.visibility='hidden');figs.scrollLeft=0;
  const D=Math.max(260,Math.min(650,14000/tuiles.length));
  for(const t of tuiles){
   if(moi!==tour||!figs.isConnected)return;
   const F=figs.getBoundingClientRect(),R=t.firstChild.getBoundingClientRect();
   const cx=R.left-F.left+figs.scrollLeft+R.width/2,cy=R.top-F.top+R.height/2;
   if(cx<figs.scrollLeft+30||cx>figs.scrollLeft+figs.clientWidth-30)figs.scrollLeft=cx-figs.clientWidth/2;
   bot.style.transitionDuration=D*.45+'ms';bot.style.transform=`translateX(${cx-22}px)`;
   const col=t.firstChild.getAttribute('fill');pince.style.background=col;pince.style.opacity=1;
   await attendre(D*.5);
   if(moi!==tour)return;
   pince.style.opacity=0;t.style.visibility='';
   t.animate([{transform:`translateY(${58-cy}px)`},{transform:'translateY(0)'}],{duration:D*.5,easing:'ease-in'});
   await attendre(D*.5)}
  if(moi===tour){await attendre(500);if(moi===tour)fin()}}
 b.onclick=()=>enCours?fin():jouer();
 const cle=figs.dataset.cle,calme=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(dejaPose.has(cle)||calme)fin();else{dejaPose.add(cle);jouer()}}
new MutationObserver(()=>app.querySelectorAll('.figs:not([data-pret])').forEach(f=>{f.dataset.pret=1;poser(f)})).observe(app,{childList:true,subtree:true});

const fond=n=>{if(document.body.dataset.bg!=n)document.body.dataset.bg=n};
function home(){fond(1);app.innerHTML='';el('<div class="card"><h2>Bienvenue !</h2><p>Observe, trouve la règle et crée tes propres suites. Choisis où commencer.</p></div>',app);
 const g=el('',app);g.className='grid';
 LEVELS.slice(1).forEach((L,i)=>{const b=document.createElement('button');b.className='alt lvl';const s=etoiles(i+1);b.innerHTML=`${L.nom}<small>${L.desc}<br>⭐ ${s} / ${3*liste(i+1).length}</small>`;b.onclick=()=>level(i+1,0);g.appendChild(b)});
 const b=document.createElement('button');b.className='lvl on';b.innerHTML='🎨 Atelier : Je crée ma suite<small>Des tuiles à déplacer et des défis</small>';b.onclick=atelier;g.appendChild(b);total()}

function level(l,m){fond([0,2,4,3,1][l]);app.innerHTML='';el(`<h2>${LEVELS[l].nom}</h2>`,app);
 const r=el('',app);r.className='row';liste(l).forEach((i,pos)=>{const type=TYPE[i],b=document.createElement('button');b.title=NOMS[type];b.className=i===m?'on':'alt';b.innerHTML=`${pos+1} ${ICONE[type]}<span class="et">${'★'.repeat(saved[l+'-'+i]||0)||'&nbsp;'}</span>`;b.setAttribute('aria-label','Mission '+(pos+1)+' : '+NOMS[type]);b.onclick=()=>level(l,i);r.appendChild(b)});
 r.className=l<3?'missions six':'missions';el(`<h3>Mission ${liste(l).indexOf(m)+1} : ${NOMS[TYPE[m]]}${m===9?' (grand défi)':''}</h3>`,app);const tabs=el('',app);tabs.className='row';const zone=el('',app);
 let list=shuffle(pool(l,m)).slice(0,7),first=0,done=new Set();
 ['1. J’observe','2. On essaie','3. À moi'].forEach((t,i)=>{const b=document.createElement('button');b.className='alt';b.textContent=t;b.onclick=()=>go(i,0);tabs.appendChild(b)});
 function go(phase,k){[...tabs.children].forEach((b,i)=>b.className=i===phase?'on':'alt');zone.innerHTML='';
  if(phase===0)return observe(l,m,zone,k,()=>go(1,0));
  const guided=phase===1,count=guided?2:5,idx=guided?k:2+k;
  el(`<h3>${guided?'On essaie':'À moi'} : exercice ${k+1} de ${count}</h3>`,zone);
  exercise(l,m,list[idx],guided,zone,perfect=>{
   if(!guided&&!done.has(k)){done.add(k);if(perfect)first++}
   const n=el('',zone);n.className='row';const b=document.createElement('button');n.appendChild(b);
   if(k+1<count){b.textContent='Exercice suivant ➜';b.onclick=()=>go(phase,k+1)}
   else if(guided){b.textContent='Je passe à « À moi » ➜';b.onclick=()=>go(2,0)}
   else if(done.size===5){const s=first>=4?3:first>=2?2:1;saved[l+'-'+m]=Math.max(s,saved[l+'-'+m]||0);try{localStorage.setItem('suites',JSON.stringify(saved))}catch(e){}total();
    el(`<div class="msg ok">🎉 Mission terminée ! ${'⭐'.repeat(s)}<br>${first} exercice(s) sur 5 réussis du premier coup.</div>`,zone);
    b.textContent='Rejouer avec de nouveaux nombres';b.onclick=()=>level(l,m)}
   else{b.textContent='Faire les exercices manqués';b.onclick=()=>go(2,[0,1,2,3,4].find(i=>!done.has(i)))}
  })}
 go(0,0)}

function maPropreEntree(parent,rule,interdits){const [a,b]=rule;
 const d=el('<h3 style="margin-top:0">➕ Ajoute ta propre entrée</h3><div class="row"><span>Mon entrée :</span><input class="num mienne" inputmode="numeric" aria-label="Mon entrée"><button type="button">▶ Envoyer au robot</button></div>',parent);d.className='propre';
 const msg=el('',d),zone=el('',d),champ=$('.mienne',d),envoyer=$('button',d);msg.className='msg';
 const permis=n=>!interdits().includes(n);
 function go(){zone.innerHTML='';msg.className='msg';msg.textContent='';const t=champ.value.trim(),n=Number(t);
  if(!/^\d+$/.test(t)||n>100){note(msg,'no','Écris un nombre entier de 0 à 100.');return}
  if(!permis(n)){note(msg,'no','Cette entrée est déjà dans ta question. Choisis un autre nombre.');return}
  const mach=el(machine([[n,null]]),zone),rep_=$('.answer',mach),sortie=$('.ball.out',mach);rep_.setAttribute('aria-label','Ma sortie pour mon entrée');animate(mach);
  const row=el('',zone);row.className='row';const v=document.createElement('button');v.textContent='✔ Vérifier ma sortie';row.appendChild(v);let essais=0;
  note(msg,'tip','Quelle sortie le robot va-t-il donner ? Écris-la, puis vérifie.');
  v.onclick=()=>{if(!permis(n)){zone.innerHTML='';note(msg,'no','Cette entrée est déjà dans ta question. Choisis un autre nombre.');return}
   const r=rep_.value.trim();if(!/^\d+$/.test(r)){note(msg,'no','Écris ta sortie avec un nombre.');return}
   const bon=a*n+b,juste=Number(r)===bon;if(!juste)essais++;
   if(!juste&&essais<2){note(msg,'no','Pas encore. Vérifie ton calcul et réessaie.');return}
   v.disabled=true;rep_.value=bon;rep_.readOnly=true;sortie.textContent=bon;animate(mach);
   note(msg,juste?'ok':'tip',juste?`🎉 Bravo ! Pour l’entrée ${n}, le robot donne ${bon}.`:`Pour l’entrée ${n}, le robot donne ${bon}. Observe bien, puis essaie une autre entrée.`)}}
 envoyer.onclick=go;champ.onkeydown=e=>{if(e.key==='Enter')go()};champ.oninput=()=>{zone.innerHTML='';msg.className='msg';msg.textContent=''}}

 btn('🗑 Effacer la tuile',del,tools);
 btn('↶ Annuler',()=>{if(history.length){work=JSON.parse(history.pop());sel=null;active=Math.min(active,work.zones-1);draw()}},tools);
 btn('Copier la figure précédente',()=>{if(!active){note(m,'tip','Choisis d’abord la figure 2 ou une figure suivante.');return}if(work.tiles.some(t=>Math.floor(t.x/ZW)===active))note(m,'tip','La figure a été remplacée. « Annuler » permet de revenir.');snapshot();work.tiles=work.tiles.filter(t=>Math.floor(t.x/ZW)!==active).concat(work.tiles.filter(t=>Math.floor(t.x/ZW)===active-1).map(t=>({...t,x:t.x+ZW})));sel=null;draw()},tools);
 btn('+ Figure',()=>{if(work.zones<6){snapshot();work.zones++;active=work.zones-1;draw()}},tools);
 btn('Vider la figure',()=>{snapshot();work.tiles=work.tiles.filter(t=>Math.floor(t.x/ZW)!==active);sel=null;draw()},tools);
 function counts(){const c=Array.from({length:work.zones},(_,i)=>work.tiles.filter(t=>Math.floor(t.x/ZW)===i).length);while(c.length&&!c[c.length-1])c.pop();return c}
 function boardSVG(clean){const W=work.zones*ZW;let s=`<svg xmlns="http://www.w3.org/2000/svg" id="board" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for(let i=0;i<work.zones;i++)s+=`<rect data-z="${i}" x="${i*ZW+3}" y="3" width="${ZW-6}" height="${H-6}" rx="10" fill="${!clean&&i===active?'#fff8dc':'#f7fbff'}" stroke="#8aa" stroke-width="2"/><text x="${i*ZW+ZW/2}" y="${H-14}" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" pointer-events="none">Figure ${i+1}</text>`;
  work.tiles.forEach((t,i)=>{s+=shapeSVG(t.s,t.c,t.x,t.y,t.r).replace('<g ',`<g data-i="${i}" style="cursor:grab" `);if(!clean&&t===sel)s+=`<circle cx="${t.x}" cy="${t.y}" r="31" fill="none" stroke="#14213d" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>`});
  return s+'</svg>'}
 function draw(){const left=wrap.scrollLeft;wrap.innerHTML=boardSVG(false);wrap.scrollLeft=left;table();
  const svg=$('#board');svg.onpointerdown=e=>{if(challenge)return;const g=e.target.closest('[data-i]');
   if(!g){const z=e.target.getAttribute('data-z');if(z!==null){active=+z;sel=null;draw()}return}
   e.preventDefault();const t=work.tiles[+g.dataset.i],p=point(e),dx=t.x-p.x,dy=t.y-p.y,before=JSON.stringify(work);let moved=false;sel=t;active=Math.floor(t.x/ZW);
   const move=ev=>{const q=point(ev),x=clamp(snap(q.x+dx),20,work.zones*ZW-20),y=clamp(snap(q.y+dy),40,H-60);if(x!==t.x||y!==t.y){moved=true;t.x=x;t.y=y;g.setAttribute('transform',`translate(${x} ${y}) rotate(${t.r})`)}};
   const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);if(moved)history.push(before);active=Math.floor(t.x/ZW);draw()};
   window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end)}}
 function table(){const c=counts();info.style.overflowX='auto';info.innerHTML=challenge||!c.length?'':'<table><tr><th>Figure</th>'+c.map((_,i)=>`<td>${i+1}</td>`).join('')+'</tr><tr><th>Tuiles</th>'+c.map(v=>`<td>${v}</td>`).join('')+'</tr></table>'}
 const rz=el('<p><b>La règle de la suite :</b></p><div class="row"><span>Tuiles =</span><input class="rule" placeholder="Écris la règle avec n" aria-label="Règle de la suite"></div><small>n = numéro de la figure</small>',card),inp=$('input',rz);
 rz.appendChild(keys(inp,'n'));card.appendChild(m);const act=el('',card);act.className='row';
 btn('✔ Vérifier la règle',()=>{const c=counts();if(c.length<2||c.includes(0)){note(m,'no','Construis au moins 2 figures qui se suivent à partir de la figure 1.');return}
  const f=parseRule(inp.value);if(!f){note(m,'no','Écris la règle avec n, des nombres, + et ×.');return}
  const d=c.slice(1).map((v,i)=>v-c[i]),reg=d.every(v=>v===d[0]);
  const growth=c.length<3?'Ajoute une 3e figure pour vérifier si la croissance est régulière.':reg&&d[0]>0?`Ta suite est à croissance régulière : + ${d[0]} par figure.`:'Ta suite n’est pas à croissance régulière.';
  const k=c.findIndex((v,i)=>f(i+1)!==v);
  note(m,k<0?'ok':'no',(k<0?'🎉 La règle fonctionne pour toutes les figures construites ! ':`À la figure ${k+1}, la règle donne ${f(k+1)}, mais il y a ${c[k]} tuiles. `)+growth)},act);
 const ch=btn('🕵️ Mode défi',()=>{const c=counts();if(!challenge&&(c.length<2||c.includes(0))){note(m,'no','Construis au moins 2 figures avant de lancer un défi.');return}
  challenge=!challenge;sel=null;edit.hidden=challenge;inp.value='';ch.textContent=challenge?'✏️ Quitter le défi':'🕵️ Mode défi';draw();m.className='msg';if(challenge)note(m,'tip','Défi lancé ! Passe l’appareil à ton camarade : il doit trouver la règle.')},act);
 btn('🖼 Voir mon image',()=>{const keep=sel;sel=null;const svg=boardSVG(true),img=new Image();sel=keep;
  img.onload=()=>{const c=document.createElement('canvas');c.width=work.zones*ZW;c.height=H;c.getContext('2d').drawImage(img,0,0);$('#shot').src=c.toDataURL('image/png');$('#modal').style.display='flex'};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)},act);
 document.onkeydown=e=>{if(!challenge&&sel&&$('#board')&&e.target.tagName!=='INPUT'&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();del()}};
 palette();draw()}
$('#home').onclick=home;$('#close').onclick=()=>$('#modal').style.display='none';
home();
</script>
</body>
</html>
